<!-- Search Form -->
<div class="flex items-center justify-center space-x-4 py-2">
    <input type="text" placeholder="Search..."  class="border border-gray-300 rounded-lg p-2 w-2/3 md:w-1/3" #searchInput >
    <button (click)="updateSearchText()" class="bg-blue-900 text-white font-semibold py-1 px-2 rounded">Search</button>
</div>

<!-- Search Result -->
<div class="py-4 h-10">
    <p *ngIf="searchText" class="text-gray-700">Search result for: <strong class="font-bold">{{searchText}}</strong></p>
</div>
