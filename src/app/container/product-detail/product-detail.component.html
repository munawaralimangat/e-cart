<div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-end z-50" *ngIf="product">
  <div class="bg-white w-full sm:w-1/2 lg:w-1/3 h-full sm:h-full p-6 rounded-l-lg shadow-lg overflow-y-auto">
    <button class="text-red-500 float-right" (click)="onClose()">Close</button>
    <img class="w-56 h-56 object-cover rounded mb-4" [src]="product.imageUrl" alt="Product Image">
    <div class="mt-4">
      <h2 class="text-2xl font-bold mb-2">{{product.name}}</h2>
      <p class="text-gray-700 text-base mb-4">
        {{product.description}}
      </p>
      <p class="text-gray-900 font-semibold text-xl mb-4">{{product.price}}</p>
      <div class="mb-4">
        <span [setBackground] [setText]="'white'" class="inline-block  rounded-full px-3 py-1 text-sm font-semibold text-gray-800">#{{product.gender}}</span>
        <span [setBackground]="'green'" [setText]="'white'" class="inline-block  rounded-full px-3 py-1 text-sm font-semibold text-gray-800">#{{product.brand}}</span>
        <span [setBackground] [setText]="'white'" class="inline-block  rounded-full px-3 py-1 text-sm font-semibold text-gray-800">#{{product.category}}</span>
      </div>
      <button appHover *ngIf="product.isAvailable; else notifyMe" class="w-1/2 mt-10 bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
        Add to Cart
      </button>
      <ng-template #notifyMe>
        <button class="w-1/2 mt-10 bg-orange-900 hover:bg-orange-800 text-white font-bold py-2 px-4 rounded">
          Notify Me
        </button>
      </ng-template>
    </div>
  </div>
  </div>
