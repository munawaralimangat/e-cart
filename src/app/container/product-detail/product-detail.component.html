<div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-end z-50" *ngIf="product">
    <div class="bg-white w-full sm:w-1/2 lg:w-1/3 h-full sm:h-full p-6 rounded-l-lg shadow-lg overflow-y-auto">
      <button class="text-red-500 float-right" (click)="onClose()">Close</button>
      <h2 class="text-3xl font-bold mb-4">{{ product.name }}</h2>
      <img [src]="product.imageUrl" alt="{{ product.name }}" class="w-56 h-56 object-cover rounded mb-4">
      <p class="text-xl font-semibold text-gray-700 mb-2">Price: ${{ product.price }}</p>
      <p class="text-lg text-gray-600 mb-2">Brand: {{ product.brand }}</p>
      <p class="text-lg text-gray-600 mb-2">Category: {{ product.category }}</p>
      <p class="text-lg text-gray-600 mb-2">Sizes: {{ product.sizes.join(', ') }}</p>
      <p class="text-lg text-gray-600 mb-4">Colors: {{ product.colors.join(', ') }}</p>
      <p class="text-md text-gray-500 mb-6">{{ product.description }}</p>
    </div>
  </div>
