<div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-end z-50" *ngIf="product">
  <div class="w-1/3 p-4 bg-white rounded-lg shadow-lg">
    <button class="text-red-500 float-right" (click)="onClose()">Close</button>
    <img class="w-full rounded-lg object-contain" [src]="product.imageUrl" alt="Product Image">
    <div class="mt-4">
      <h2 class="text-2xl font-bold mb-2">{{product.name}}</h2>
      <p class="text-gray-700 text-base mb-4">
        Description of the product goes here. You can add more details as needed.
      </p>
      <p class="text-gray-900 font-semibold text-xl mb-4">$Price</p>
      <div class="mb-4">
        <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2">#Category</span>
        <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700">#AnotherTag</span>
      </div>
      <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Add to Cart
      </button>
    </div>
  </div>
  </div>
